<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>제조 AI · 알림 검토</title>
<style>
:root{
  color-scheme:dark;
  --page-bg:#0b1220;
  --page-glow:#15243a;
  --surface:#121d2d;
  --surface-raised:#18263a;
  --surface-hover:#20344d;
  --border:#2b405b;
  --text:#e8f0fa;
  --muted:#9eb0c4;
  --accent:#8fc7ff;
  --focus:#4b9be6;
  --notice-bg:#332914;
  --notice-border:#806528;
  --table-border:#293b53;
}
:root[data-theme="light"]{
  color-scheme:light;
  --page-bg:#f3f5f8;
  --page-glow:#ffffff;
  --surface:#ffffff;
  --surface-raised:#f7faff;
  --surface-hover:#e8f0fa;
  --border:#aebbc7;
  --text:#172a3a;
  --muted:#586b7c;
  --accent:#155fa0;
  --focus:#155fa0;
  --notice-bg:#fff3d5;
  --notice-border:#e4c56a;
  --table-border:#e1e7ed;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--page-bg)}
body{min-height:100vh;margin:0;background:radial-gradient(circle at 15% 0%,var(--page-glow),transparent 38%),var(--page-bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
header,main{max-width:1100px;margin:auto;padding:24px}
header{padding-top:32px;padding-bottom:12px}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
header p{margin:4px 0;color:var(--muted)}
h1{margin:0;font-size:28px;line-height:1.25;letter-spacing:-.02em}
.notice{margin-top:18px;background:var(--notice-bg);border:1px solid var(--notice-border);padding:12px 14px;border-radius:10px;color:var(--text)}
.grid{display:grid;grid-template-columns:300px 1fr;gap:24px}
section{background:var(--surface);border:1px solid var(--border);padding:20px;border-radius:14px;box-shadow:0 12px 30px rgb(0 0 0 / .16)}
button,select,textarea{font:inherit;color:var(--text);background:var(--surface-raised);padding:9px;border:1px solid var(--border);border-radius:8px}
button{cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
button:hover:not(:disabled){background:var(--surface-hover);border-color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.theme-toggle{white-space:nowrap;background:var(--surface-raised);color:var(--accent)}
#list{margin:12px 0 16px}
#list button{display:block;width:100%;text-align:left;margin:8px 0;background:var(--surface-raised);border-color:transparent}
#list button:hover,#list button[aria-current="true"]{background:var(--surface-hover);border-color:var(--accent)}
textarea{display:block;width:95%;min-height:80px;resize:vertical}
table{width:100%;border-collapse:collapse}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--table-border)}
th{color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
#message{font-weight:600;color:var(--accent)}
@media(max-width:700px){.header-row{align-items:stretch;flex-direction:column}.theme-toggle{align-self:flex-start}.grid{grid-template-columns:1fr}}
</style>
<header><div class="header-row"><div><p>MANUFACTURING AI / 검토 작업대</p><h1>표본 알림을 확인하고 의견을 남기세요</h1></div><button id="themeToggle" class="theme-toggle" type="button" aria-pressed="true">라이트 모드</button></div><p class="notice">교육용 합성 데이터 · 실제 고장 확정 아님 · 관측 시각 및 설비 식별자 없음</p></header>
<main class="grid"><section><h2>알림 목록</h2><p id="count" role="status"></p><button id="reload">새로고침</button><div id="list"></div><button id="prev">이전</button> <button id="next">다음</button></section>
<section><h2>알림 상세</h2><p id="detailStatus" role="status">목록에서 표본을 선택하세요.</p><div id="detail" hidden><h3 id="sample"></h3><p id="score"></p><p class="muted">최신성: 알 수 없음 · 심각도: 미평가<br>이상 점수는 고장 확률이 아닙니다.</p><table><thead><tr><th>관측 변수</th><th>값</th><th>단위</th></tr></thead><tbody id="measurements"></tbody></table><h3>다음 확인</h3><p>원본 관측값을 확인하세요. SOP 근거가 없어 원인과 점검 조치 판단은 보류합니다.</p><form id="feedback"><label>이 표본의 이상 판단에 동의하나요? <select id="verdict"><option value="unknown">모름</option><option value="yes">맞음</option><option value="no">아님</option></select></label><p><label for="note">실제 확인·조치 메모 (선택)</label><textarea id="note" maxlength="2000"></textarea></p><button id="save">검토 대기로 저장</button><p class="muted">의견은 정답이나 재학습 자료로 자동 반영되지 않습니다.</p></form><p id="message" role="status"></p></div></section></main>
<script>
const $=id=>document.getElementById(id);let offset=0,selected=null,revision=0,pending=null;
const themeKey='manufacturing-agent-theme';
try{if(localStorage.getItem(themeKey)==='light')document.documentElement.dataset.theme='light'}catch{}
const themeToggle=$('themeToggle');
function updateThemeToggle(){const dark=document.documentElement.dataset.theme!=='light';themeToggle.textContent=dark?'라이트 모드':'다크 모드';themeToggle.setAttribute('aria-pressed',String(dark));themeToggle.setAttribute('aria-label',dark?'라이트 모드로 전환':'다크 모드로 전환')}
themeToggle.onclick=()=>{const dark=document.documentElement.dataset.theme!=='light';if(dark)document.documentElement.dataset.theme='light';else delete document.documentElement.dataset.theme;try{localStorage.setItem(themeKey,dark?'light':'dark')}catch{}updateThemeToggle()};updateThemeToggle();
async function api(path,options){const r=await fetch(path,{...options,signal:AbortSignal.timeout(8000)});const b=await r.json();if(!r.ok)throw new Error(b.error?.code||'request_failed');return b}
async function listing(){const token=++revision;selected=null;$('detail').hidden=true;$('detailStatus').textContent='목록에서 표본을 선택하세요.';$('list').replaceChildren();$('count').textContent='불러오는 중…';$('prev').disabled=$('next').disabled=true;try{const b=await api('/events?limit=20&offset='+offset);if(token!==revision)return;$('count').textContent=b.total?`총 ${b.total}개 · ${offset+1}–${offset+b.items.length}`:'표시할 알림이 없습니다.';for(const e of b.items){const btn=document.createElement('button');btn.textContent=`표본 ${e.sampleId} · 점수 ${e.score.toFixed(2)}`;btn.onclick=()=>detail(e.eventId);$('list').append(btn)}$('prev').disabled=offset===0;$('next').disabled=offset+20>=b.total}catch(e){if(token===revision)$('count').textContent='목록 조회 실패. 새로고침으로 재시도하세요.'}}
async function detail(id){const token=++revision;selected=null;pending=null;$('detail').hidden=true;$('detailStatus').textContent='상세 조회 중…';try{const e=await api('/events/'+id);if(token!==revision)return;selected=id;$('detailStatus').textContent='';$('detail').hidden=false;$('sample').textContent='표본 '+e.sampleId;$('score').textContent=`이상 점수 ${e.score.toFixed(3)} / 임계값 ${e.threshold.toFixed(3)}`;$('measurements').replaceChildren();for(const m of e.measurements){const tr=document.createElement('tr');for(const v of [m.name,m.value,m.unit]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('measurements').append(tr)}$('feedback').reset();$('save').disabled=false;$('message').textContent=''}catch(e){if(token===revision)$('detailStatus').textContent=e.message==='event_not_found'?'해당 알림을 찾을 수 없습니다.':'상세 조회 실패. 표본을 다시 선택하세요.'}}
$('feedback').onsubmit=async ev=>{ev.preventDefault();if(!selected)return;const id=selected,body={verdict:$('verdict').value,note:$('note').value};const signature=JSON.stringify([id,body]);if(!pending||pending.signature!==signature)pending={signature,key:crypto.randomUUID()};$('save').disabled=true;try{await api('/events/'+id+'/feedback',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':pending.key},body:JSON.stringify(body)});if(id===selected)$('message').textContent='검토 대기로 저장했습니다. 자동 재학습하지 않습니다.'}catch(e){if(id===selected)$('message').textContent='저장 실패. 다시 저장하면 중복 없이 재시도합니다.'}finally{if(id===selected)$('save').disabled=false}};
$('reload').onclick=()=>{offset=0;listing()};$('prev').onclick=()=>{offset=Math.max(0,offset-20);listing()};$('next').onclick=()=>{offset+=20;listing()};listing();
</script></html>
